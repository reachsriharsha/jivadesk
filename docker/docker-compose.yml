# Docker Compose for JivaDesk (MVP)
version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: jivadesk
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jivadesk
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
