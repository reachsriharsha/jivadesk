# Production Docker Compose for JivaDesk
version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: jivadesk
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jivadesk
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ../src/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - ENV=production
    depends_on:
      - db
  frontend:
    build: ../src/frontend
    command: bun run build && bun run preview
    depends_on:
      - backend
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
volumes:
  db_data:
